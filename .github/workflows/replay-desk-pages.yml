# Publishes REPLAY DESK at https://matthiasrattansingh.github.io/matthiasrattansingh/
# NOTE: a repo has ONE Pages site. This replaces TAPE (tape-pages.yml on
# claude/ecstatic-maxwell-milzer); a later TAPE deploy would replace REPLAY DESK again.
# One-time setup: Settings -> Environments -> github-pages -> Deployment branches: allow
# claude/replay-desk-simulator-da5dc5 (or merge to an allowed branch). Otherwise deploy fails in seconds.
# The verify job proves the live URL serves THIS commit's page and data, not just that an upload happened.
name: REPLAY DESK → GitHub Pages

on:
  push:
    branches: [claude/replay-desk-simulator-da5dc5, claude/brent-refined-trading-game-5o18st, main]
    paths: [site/**, data/**, scripts/build-replay-site.mjs, test/replay/**, .github/workflows/replay-desk-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (fills, slippage/fees, contract + spread P&L, no-lookahead)
        run: node --test --test-reporter=spec "test/replay/*.test.js"
      - name: Build static site
        run: node scripts/build-replay-site.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Live site serves this commit's REPLAY DESK page and data
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -u
          for i in $(seq 1 30); do
            got=$(curl -fsS "${URL}version.json?t=$(date +%s)" | sed -n 's/.*"sha": *"\([0-9a-f]*\)".*/\1/p' || true)
            echo "attempt $i: live sha=${got:-none} want=$GITHUB_SHA"
            [ "$got" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          [ "$got" = "$GITHUB_SHA" ] || { echo "::error::live site is not serving $GITHUB_SHA"; exit 1; }
          html=$(curl -fsS "${URL}?t=$(date +%s)")
          echo "$html" | grep -q '<title>REPLAY DESK</title>' || { echo "::error::index.html is not REPLAY DESK"; exit 1; }
          for f in js/app.js js/session.js css/app.css js/coach.js js/coach-ui.js js/coachbot.js data/manifest.json data/headlines.json data/coach.json data/CL.json data/BZ.json data/NG.json data/RB.json data/HO.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}${f}")
            echo "$code $f"; [ "$code" = 200 ] || { echo "::error::$f returned $code"; exit 1; }
          done
          echo "Live: $URL serves REPLAY DESK at $GITHUB_SHA with all data files."
